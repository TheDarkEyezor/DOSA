[package]
name = "dosa"
version = "0.1.0"
edition = "2021"
description = "Digitally Optimized Smart Assistant - A personal AI assistant with knowledge graph"
authors = ["TheDarkEyezor"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client for Ollama API
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite database
rusqlite = { version = "0.30", features = ["bundled"] }

# CLI enhancements
rustyline = "14.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Natural language date parsing
chrono-english = "0.1"

# File path expansion
shellexpand = "3.1.1"

# Regex for pronoun replacement
regex = "1.10"

# Parallel processing for document ingestion
rayon = "1.10"

# Fuzzy string matching for entity deduplication
strsim = "0.11"

# OAuth2 authentication
oauth2 = "4.4"

# Secure credential storage (macOS Keychain)
keyring = "2"

# Base64 encoding for email content
base64 = "0.21"

# URL encoding
urlencoding = "2.1"

# Open browser for OAuth
open = "5"

# Tiny HTTP server for OAuth callback
tiny_http = "0.12"

# Lazy static initialization
once_cell = "1.19"

# ONNX Runtime for neural intent classification
ort = { version = "2.0.0-rc.9", default-features = false, features = ["ndarray", "std", "download-binaries"] }

# Tokenizer for BERT models
tokenizers = "0.21"

# Ndarray for tensor operations
ndarray = "0.16"

# PDF text extraction for RAG document ingestion
pdf-extract = "0.7"

# UUID generation for document IDs
uuid = { version = "1.6", features = ["v4"] }

# Walkdir for recursive directory traversal
walkdir = "2.4"

# Audio capture for voice input (optional - requires cmake to build)
cpal = { version = "0.15", optional = true }

# Audio sample format conversion
hound = { version = "3.5", optional = true }

# Whisper speech-to-text (whisper.cpp Rust bindings) - requires cmake
whisper-rs = { git = "https://codeberg.org/tazz4843/whisper-rs.git", optional = true }

# Background task scheduler for proactive assistant
tokio-cron-scheduler = "0.13"

# Platform-specific directories
dirs = { version = "5.0", optional = true }

# Logging
log = "0.4"
env_logger = "0.11"

# Random number generation
rand = "0.8"

# Axum web framework for webhook server (WhatsApp)
axum = { version = "0.7", optional = true }

[features]
default = []
voice = ["cpal", "hound", "whisper-rs", "dirs"]
whatsapp = ["axum"]

